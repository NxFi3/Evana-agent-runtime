{% extends "base.html" %}

{% block title %}ShopBase | {{ product.name }}{% endblock %}

{% block content %}
<div class="product-detail-layout">
    <div class="product-gallery">
        <img src="{{ url_for('static', filename='product_images/' + product.image_filename) }}" alt="{{ product.name}}">
    </div>
    <div class="product-details">
        <h1>{{ product.name }}</h1>
        <p class="price">${{ "%.2f"|format(product.price) }}</p>
        
        <p class="product-description">{{ product.description }}</p>
        
        {# Form submission to trigger POST request to add_to_cart #}
        <form action="{{ url_for('add_to_cart', image_filename=product.image_filename) }}" method="POST">
            <button type="submit" class="add-to-cart-btn-large">Add to Cart</button>
        </form>
    </div>
</div>
{% endblock %}
