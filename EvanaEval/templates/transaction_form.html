{% extends "base.html" %}
{% block content %}
<h2>{{ action }} Transaction</h2>
<form method="post" action="{{ url_for('add_transaction') if action=='Add' else url_for('edit_transaction', id=transaction.id) }}">
    <label>Amount:<br>
        <input type="number" step="0.01" name="amount" value="{{ transaction.amount if transaction else '' }}" required>
    </label><br>
    <label>Description:<br>
        <input type="text" name="description" value="{{ transaction.description if transaction else '' }}">
    </label><br>
    <label>Category:<br>
        <select name="category_id">
            <option value="">None</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if transaction and transaction.category_id==cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
    </label><br>
    <label>Date:<br>
        <input type="date" name="date" value="{{ transaction.date if transaction else '' }}" required>
    </label><br>
    <button type="submit">{{ action }}</button>
</form>
{% endblock %}
