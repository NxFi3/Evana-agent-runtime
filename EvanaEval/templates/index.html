<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <h1>Task Manager</h1>
    <form action="{{ url_for('create_task') }}" method="post" class="create-form">
      <input type="text" name="title" placeholder="New task title" required>
      <button type="submit">Add</button>
    </form>
    <ul class="task-list">
      {% for task in tasks %}
        <li class="task {% if task.completed %}completed{% endif %}">
          <span>{{ task.title }}</span>
          <form action="{{ url_for('complete_task', task_id=task.id) }}" method="post" style="display:inline;">
            <button type="submit" {% if task.completed %}disabled{% endif %}>Complete</button>
          </form>
          <form action="{{ url_for('delete_task', task_id=task.id) }}" method="post" style="display:inline;">
            <button type="submit">Delete</button>
          </form>
        </li>
      {% else %}
        <li>No tasks yet.</li>
      {% endfor %}
    </ul>
  </body>
</html>
