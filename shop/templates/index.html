{% extends 'base.html' %}
{% block title %}Products{% endblock %}
{% block content %}
<h1>Products</h1>
<form method="get" action="{{ url_for('product_list') }}" class="row g-3 mb-4">
  <div class="col-auto">
    <input type="text" name="q" class="form-control" placeholder="Search" value="{{ query }}">
  </div>
  <div class="col-auto">
    <select name="category" class="form-select">
      <option value="">All Categories</option>
      {% for cat in categories %}
      <option value="{{ cat }}" {% if cat.lower() == selected_category %}selected{% endif %}>{{ cat }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">Filter</button>
  </div>
</form>
<div class="row row-cols-1 row-cols-md-3 g-4">
  {% for product in products %}
  <div class="col">
    <div class="card h-100 product-card">
      <img src="{{ product.image }}" class="card-img-top product-image" alt="{{ product.name }}">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text mb-4">${{ product.price }}</p>
        <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn btn-secondary mb-2">View</a>
        <form method="post" action="{{ url_for('add_to_cart') }}">
          <input type="hidden" name="product_id" value="{{ product.id }}">
          <button type="submit" class="btn btn-primary mt-auto">Add to Cart</button>
        </form>
      </div>
    </div>
  </div>
  {% else %}
  <p>No products found.</p>
  {% endfor %}
</div>
{% endblock %}
